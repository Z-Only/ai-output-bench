name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - name: Test fail-closed coverage gate
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Enforce total and changed executable lines at least 95 percent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree --stdin </dev/null)
          fi
          python3 scripts/check_coverage.py --base "$BASE_SHA" --report coverage/lcov.info . --total-min 95 --changed-min 95 --json-output coverage/summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14
          if-no-files-found: warn
  ci-gate:
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification step
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
